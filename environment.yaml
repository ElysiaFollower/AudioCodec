name: audiocodec
# Cross-platform local development environment. On Linux CUDA training machines,
# use environment-linux-cuda.yaml instead so PyTorch/CUDA/NCCL are pinned together.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - ffmpeg
  - matplotlib
  - numpy
  - setuptools>=68
  - wheel
  - pip:
      - tensorboard>=2.16,<3
      - torch>=2.2,<3
      - torchaudio>=2.2,<3
      - -e .
